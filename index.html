<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Inventory Management System</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg,#020617,#0f172a,#111827);
            min-height: 100vh;
            color: white;
            padding: 40px;
        }

        .container{
            max-width: 1400px;
            margin: auto;
        }

        .top-bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1{
            font-size: 55px;
            background: linear-gradient(90deg,#60a5fa,#38bdf8,#818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .subtitle{
            color: #94a3b8;
            margin-bottom: 35px;
            font-size: 18px;
        }

        .dashboard{
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
            gap: 25px;
            margin-bottom: 35px;
        }

        .card{
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(14px);
            border-radius: 22px;
            padding: 30px;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            position: relative;
            overflow: hidden;
        }

        .card::before{
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            background: rgba(96,165,250,0.15);
            border-radius: 50%;
            top: -30px;
            right: -30px;
        }

        .card:hover{
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(59,130,246,0.25);
        }

        .card h2{
            font-size: 42px;
            margin-bottom: 10px;
        }

        .card p{
            color: #cbd5e1;
            font-size: 16px;
        }

        .inputs{
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 35px;
        }

        input{
            flex: 1;
            min-width: 220px;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 15px;
            outline: none;
            border: 1px solid rgba(255,255,255,0.08);
            transition: 0.3s;
        }

        input:focus{
            border: 1px solid #3b82f6;
            box-shadow: 0 0 12px rgba(59,130,246,0.5);
        }

        input::placeholder{
            color: #94a3b8;
        }

        .add-btn{
            padding: 16px 30px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg,#2563eb,#3b82f6);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(59,130,246,0.35);
        }

        .add-btn:hover{
            transform: scale(1.05);
        }

        .logout-btn{
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg,#ef4444,#dc2626);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .logout-btn:hover{
            transform: scale(1.05);
        }

        .chart-box{
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            padding: 25px;
            margin-bottom: 35px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        #products{
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(350px,1fr));
            gap: 25px;
        }

        .product{
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            padding: 28px;
            backdrop-filter: blur(12px);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .product::before{
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            background: rgba(59,130,246,0.12);
            border-radius: 50%;
            top: -50px;
            right: -40px;
        }

        .product:hover{
            transform: translateY(-6px);
            border-color: rgba(96,165,250,0.4);
        }

        .product h3{
            font-size: 30px;
            color: #60a5fa;
            margin-bottom: 18px;
        }

        .product p{
            margin: 12px 0;
            color: #e2e8f0;
            font-size: 16px;
        }

        .stock{
            display: inline-block;
            padding: 8px 14px;
            border-radius: 30px;
            margin-top: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .low-stock{
            background: rgba(239,68,68,0.2);
            color: #ef4444;
        }

        .good-stock{
            background: rgba(34,197,94,0.2);
            color: #22c55e;
        }

        .btn-group{
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }

        .update-btn{
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg,#0ea5e9,#2563eb);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .delete-btn{
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg,#ef4444,#dc2626);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .update-btn:hover,
        .delete-btn:hover{
            transform: scale(1.03);
        }

        @media(max-width:768px){

            body{
                padding: 20px;
            }

            h1{
                font-size: 38px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="top-bar">

        <h1>Smart Inventory Management</h1>

        <button class="logout-btn" onclick="logoutUser()">
            Logout
        </button>
        <button class="add-btn" onclick="downloadPDF()">
    Export PDF
</button>

    </div>

    <p class="subtitle">
        Manage products, inventory stock and pricing in real-time
    </p>

    <div class="dashboard">

        <div class="card">
            <h2 id="totalProducts">0</h2>
            <p>Total Products</p>
        </div>

        <div class="card">
            <h2 id="totalValue">₹0</h2>
            <p>Total Inventory Value</p>
        </div>

        <div class="card">
            <h2 id="lowStockCount">0</h2>
            <p>Low Stock Products</p>
        </div>

    </div>

    <div class="inputs">

        <input 
        type="text"
        id="search"
        placeholder="Search Product"
        onkeyup="searchProduct()"
        >

        <input
        type="text"
        id="name"
        placeholder="Product Name"
        >

        <input
        type="number"
        id="quantity"
        placeholder="Quantity"
        >

        <input
        type="number"
        id="price"
        placeholder="Price"
        >

        <button class="add-btn" onclick="addProduct()">
            Add Product
        </button>

    </div>

    <div class="chart-box">

        <canvas id="inventoryChart"></canvas>

    </div>

    <div id="products"></div>

</div>

<script>

const token = localStorage.getItem("token");

if(!token){

    window.location.href = "login.html";

}

let inventoryChart;

async function fetchProducts(){

    const response = await fetch(

        "http://localhost:5000/api/products",

        {

            headers: {

                Authorization: token

            }

        }

    );

    const data = await response.json();

    displayProducts(data);

}

function displayProducts(data){

    const productsDiv =
    document.getElementById("products");

    productsDiv.innerHTML = "";

    document.getElementById("totalProducts").innerText =
    data.length;

    let totalValue = 0;

    data.forEach(product => {

        totalValue += product.price * product.quantity;

        productsDiv.innerHTML += `

        <div class="product">

            <h3>${product.productName}</h3>

            <p><strong>Quantity:</strong> ${product.quantity}</p>

            <p><strong>Price:</strong> ₹${product.price}</p>

            ${
                product.quantity < 5
                ? "<span class='stock low-stock'>Low Stock</span>"
                : "<span class='stock good-stock'>In Stock</span>"
            }

            <div class="btn-group">

                <button
                class="update-btn"
                onclick="updateProduct('${product._id}')"
                >
                    Update
                </button>

                <button
                class="delete-btn"
                onclick="deleteProduct('${product._id}')"
                >
                    Delete
                </button>

            </div>

        </div>

        `;

    });

    document.getElementById("totalValue").innerText =
    "₹" + totalValue;

    const lowStock = data.filter(
        product => product.quantity < 5
    );

    document.getElementById(
        "lowStockCount"
    ).innerText = lowStock.length;

    renderChart(data);

}

async function searchProduct(){

    const searchValue =
    document.getElementById("search").value;

    if(searchValue === ""){

        fetchProducts();
        return;

    }

    const response = await fetch(

        `http://localhost:5000/api/products/search/${searchValue}`,

        {

            headers: {

                Authorization: token

            }

        }

    );

    const data = await response.json();

    displayProducts(data);

}

async function addProduct(){

    const productName =
    document.getElementById("name").value;

    const quantity =
    document.getElementById("quantity").value;

    const price =
    document.getElementById("price").value;

    if(!productName || !quantity || !price){

        alert("Please fill all fields");
        return;

    }

    await fetch(

        "http://localhost:5000/api/products",

        {

            method: "POST",

            headers: {

                "Content-Type": "application/json",
                Authorization: token

            },

            body: JSON.stringify({

                productName,
                quantity,
                price

            })

        }

    );

    document.getElementById("name").value = "";
    document.getElementById("quantity").value = "";
    document.getElementById("price").value = "";

    fetchProducts();

}

async function deleteProduct(id){

    await fetch(

        `http://localhost:5000/api/products/${id}`,

        {

            method: "DELETE",

            headers: {

                Authorization: token

            }

        }

    );

    fetchProducts();

}

async function updateProduct(id){

    const newQuantity =
    prompt("Enter New Quantity");

    if(newQuantity === null || newQuantity === ""){
        return;
    }

    await fetch(

        `http://localhost:5000/api/products/${id}`,

        {

            method: "PUT",

            headers: {

                "Content-Type": "application/json",
                Authorization: token

            },

            body: JSON.stringify({

                quantity: newQuantity

            })

        }

    );

    fetchProducts();

}

function renderChart(data){

    const labels = data.map(
        product => product.productName
    );

    const quantities = data.map(
        product => product.quantity
    );

    const ctx =
    document.getElementById(
        "inventoryChart"
    );

    if(inventoryChart){

        inventoryChart.destroy();

    }

    inventoryChart = new Chart(ctx, {

        type: "bar",

        data: {

            labels: labels,

            datasets: [{

                label: "Product Quantity",

                data: quantities,

                borderWidth: 2

            }]

        },

        options: {

            responsive: true

        }

    });

}

function logoutUser(){

    localStorage.removeItem("token");

    window.location.href = "login.html";

}
async function downloadPDF(){

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    const response = await fetch(

        "http://localhost:5000/api/products",

        {

            headers: {

                Authorization: token

            }

        }

    );

    const data = await response.json();

    // Title

    doc.setFontSize(22);

    doc.text(
        "Smart Inventory Report",
        14,
        20
    );

    // Date

    const date = new Date();

    doc.setFontSize(11);

    doc.text(

        `Generated On: ${date.toLocaleString()}`,

        14,

        30

    );

    // Table Data

    const tableData = data.map((product,index)=>[

        index + 1,

        product.productName,

        product.quantity,

        "₹" + product.price,

        "₹" + (product.quantity * product.price)

    ]);

    // Auto Table

    doc.autoTable({

        startY: 40,

        head: [[

            "S.No",

            "Product",

            "Quantity",

            "Price",

            "Total Value"

        ]],

        body: tableData,

        theme: "grid",

        styles: {

            fontSize: 11,

            cellPadding: 4

        },

        headStyles: {

            fillColor: [37, 99, 235]

        }

    });

    // Save PDF

    doc.save("inventory-report.pdf");

}

fetchProducts();

</script>

</body>
</html>
